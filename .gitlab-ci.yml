# Reference: https://hub.docker.com/r/mingc/android-build-box/
image: mingc/android-build-box:latest # Sets the latest version of the image
# NB: Java version is set in .java-version file
# Alternative is to set a specific version: https://hub.docker.com/r/mingc/android-build-box/tags
#image: mingc/android-build-box:1.28.0

variables:
  ANDROID_COMPILE_SDK: "33"
  ANDROID_BUILD_TOOLS: "34.0.4"
  ANDROID_SDK_TOOLS: "9477386"

stages:
  - quality
  - build
  - test
  - tag
  - gitlab_release
  - github_release
  - publish

include:
  - project: 'paydock/platform/gitlab-templates'
    ref: main
    file: '/security/gitlab-defectdojo.yaml'

# Improved: Use 'extends' for DRY principle
.setup_bundler:
  cache:
    paths:
      - vendor/bundle
  before_script:
    - gem install bundler -v 1.17.2
    - bundle update
  script:
    - bundle --version

buildExampleApp:
  stage: build
  extends: .setup_bundler  # Apply the shared setup
  script:
    - bundle --version
    - cp bin_schema/card-schemes.json ./mobile-sdk/src/main/assets/card_schemas.json
    - bundle exec fastlane buildDebug
  artifacts:
    paths:
      - sample/build/outputs/apk/debug/*
      - bin_schema/
  needs: ["pull_bin_file"]
  dependencies:
    - pull_bin_file

test:
  stage: test
  extends: .setup_bundler  # Apply the shared setup
  script:
    - bundle exec fastlane test
  artifacts:
    when: always
    reports:
      junit: mobile-sdk/build/test-results/testDebugUnitTest/TEST-*.xml

tag_release:
  stage: tag
  extends: .setup_bundler  # Apply the shared setup
  only:
    - release
  script:
    - bundle exec fastlane tag_release

create_gitlab_release:
  stage: gitlab_release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME == "release"'
  script:
    - echo "running release_job for $TAG"
  release:
    name: 'Release: v${CI_COMMIT_TAG}'
    description: '$CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'MobileSDK Documentation'
          url: 'https://github.com/PayDock/mobile-sdk-doc/tree/main'

create_github_release:
  stage: github_release
  extends: .setup_bundler  # Apply the shared setup
  only:
    - release
  script:
    - bundle exec fastlane create_github_release

publish_to_github:
  stage: publish
  extends: .setup_bundler  # Apply the shared setup
  only:
    - release
  script:
    - bundle exec fastlane publish_to_github

pull_bin_file:
  stage: build
  image: 412245956714.dkr.ecr.ap-southeast-2.amazonaws.com/ci:20241212-1584910654
  script: |
    aws s3 cp s3://pd-app-bin-management-staging-11/bins.zip bin_schema/bins.zip
    unzip bin_schema/bins.zip -d bin_schema/
  artifacts:
    paths:
      - bin_schema/