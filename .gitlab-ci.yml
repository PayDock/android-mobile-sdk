# This file defines the CI/CD pipeline for the Mobile SDK Android project.
# It automates the process of building, testing, and releasing the SDK.
#
# Docker Image:
# This pipeline uses a custom Docker image for building Android projects.
# Reference: https://hub.docker.com/r/mingc/android-build-box/
image: mingc/android-build-box:latest # Sets the latest version of the image
# NB: Java version is set in .java-version file
# Alternative is to set a specific version: https://hub.docker.com/r/mingc/android-build-box/tags
#image: mingc/android-build-box:1.28.0

# Variables:
# These variables define the Android SDK versions used for building the project.
variables:
  # ANDROID_COMPILE_SDK is the version of Android you're compiling with.
  # It should match compileSdkVersion.
  ANDROID_COMPILE_SDK: "35"
  # ANDROID_BUILD_TOOLS is the version of the Android build tools you are using.
  # It should match buildToolsVersion. See: SDK Manager > BuildTools
  ANDROID_BUILD_TOOLS: "35.0.0"
  # It's what version of the command line tools we're going to download from the official site.
  # Official Site-> https://developer.android.com/studio/index.html
  # There, look down below at the cli tools only, sdk tools package is of format:
  #        commandlinetools-os_type-ANDROID_SDK_TOOLS_latest.zip
  # when the script was last modified for latest compileSdkVersion, it was which is written down below
  ANDROID_SDK_TOOLS: "11076708"
  # No Gradle dependency lock files or dependency graph export exist for this project's modules
  # (bin-processor, mobile-sdk, sample, convention-plugins), so GitLab's Dependency Scanning
  # analyzer refuses to fall back to a manifest-only parse by default and fails the job outright.
  # This accepts that degraded-but-working manifest-only scan (direct dependencies parsed from
  # build.gradle.kts, no transitive resolution) instead. See:
  # https://docs.gitlab.com/ee/user/application_security/dependency_scanning/dependency_scanning_sbom
  DS_ENABLE_MANIFEST_FALLBACK: "true"

# Stages:
# Defines the stages of the pipeline. Jobs within the same stage run in parallel.
# Jobs in subsequent stages run after the previous stage has completed successfully.
stages:
  - quality # Stage for code quality checks (e.g., linting, static analysis).
  - code_quality # Stage for linting the codebase using detekt
  - dependency_validation # Stage for validating dependencies (version changes & health checks).
  - versioning # Stage for incrementing version code for new builds.
  - test # Stage for running unit and integration tests.
  - build # Stage for building the Android application.
  - deploy # Stage for deploying build to Firebase App Distribution.
  - firebase_test # Stage for optional manual Firebase Test Lab UI tests (runs after deploy).
  - tag # Stage for tagging a release.
  - gitlab_release # Stage for creating a release in GitLab.
  - github_release # Stage for creating a release in GitHub.
  - publish # Stage for publishing the SDK to GitHub.
  - maven_central # Stage for publishing to Maven Central.

# Include:
# Includes an external template for security checks from another project.
# This template is located in the 'paydock/platform/gitlab-templates' project.
include:
  - project: 'paydock/platform/gitlab-templates'
    ref: main
    file: '/security/gitlab-defectdojo.yaml' # Includes security checks from the DefectDojo template.

# .setup_bundler:
# This is a hidden job template that sets up the Ruby Bundler environment.
# It is used by other jobs to ensure they have the necessary Ruby dependencies.
.setup_bundler:
  cache:
    paths:
      - vendor/bundle # Caches the Ruby dependencies to speed up subsequent runs.
  before_script:
    - chmod +x scripts/setup_bundler.sh # Ensure it is executable in CI
    - scripts/setup_bundler.sh # Run the script
  script:
    - bundle --version # Checks the version of Bundler.

# code_quality:
# This job runs code quality checks on the codebase using detekt.
# It extends the '.setup_bundler' template to ensure the Ruby dependencies are set up.
# Generates reports that are displayed in GitLab's Code Quality tab.
code_quality:
  stage: code_quality # Runs in the 'code_quality' stage.
  extends: .setup_bundler # Inherits configurations (like Bundler setup) from the '.setup_bundler' template.
  script:
    - bundle exec fastlane code_quality # Executes the 'code_quality' lane in Fastlane.
  artifacts:
    expire_in: 1 week
    when: always # Always collect artifacts, even if the job fails
    paths:
      - reports/code-quality/ # Make all code quality reports available
      - bin-processor/build/reports/ # bin-processor detekt reports
      - mobile-sdk/build/reports/ # mobile-sdk detekt reports
    reports:
      # GitLab Code Quality report (custom format for better integration)
      codequality: reports/code-quality/gl-code-quality-report.json
    expose_as: 'Code Quality Reports'
  rules:
    - if: $CI_COMMIT_BRANCH  # Run on all branch pushes
      when: on_success
    - if: $CI_MERGE_REQUEST_IID # Run on merge (Merge Results)
      when: on_success

# dependency_guard:
# Fast check (~10 sec) that compares resolved dependencies against the committed baseline.
# Fails if ANY dependency version changes are detected (e.g., Compose 1.8.3 -> 1.9.0).
# This prevents unintended transitive dependency upgrades that could break merchant integrations.
dependency_guard:
  stage: dependency_validation
  extends: .setup_bundler
  script:
    - echo "Running Dependency Guard - detecting version changes..."
    - ./gradlew dependencyGuard --console=plain
    - echo "SUCCESS - No dependency version changes detected"
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - mobile-sdk/dependencies/
    expose_as: 'Dependency Guard Baseline'
  rules:
    - if: $CI_COMMIT_BRANCH  # Run on all branch pushes (for testing phase)
      when: on_success
    - if: $CI_MERGE_REQUEST_IID # Run on merge requests
      when: on_success

# dependency_health:
# Deep check (~1 min) that analyzes dependency health issues:
#   - Unused dependencies that should be removed
#   - Incorrect configurations (api vs implementation)
#   - Transitive dependencies used directly in code
# Only runs if dependency_guard passes (versions are correct first).
dependency_health:
  stage: dependency_validation
  extends: .setup_bundler
  needs:
    - job: dependency_guard
      artifacts: false
  script:
    - echo "Running Dependency Analysis - checking dependency health..."
    - ./gradlew buildHealth --console=plain
    - echo "SUCCESS - All dependencies are healthy"
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - build/reports/dependency-analysis/
    expose_as: 'Dependency Health Reports'
  rules:
    - if: $CI_COMMIT_BRANCH  # Run on all branch pushes (for testing phase)
      when: on_success
    - if: $CI_MERGE_REQUEST_IID # Run on merge requests
      when: on_success

## test: (All flavors are the same)
## This job runs the unit tests for the various flavors of the Android application.
test:
  stage: test # Runs in the 'test' stage.
  extends: .setup_bundler # Extends the '.setup_bundler' template.
  script:
    - bundle exec fastlane test flavor:staging build_type:Debug
  environment:
    name: staging # Sets the environment name to 'staging'.
  artifacts:
    expire_in: 7 days
    when: always # Always creates artifacts, even if the job fails.
    paths:
      - build/reports/jacoco/merged/html/ # Merged HTML coverage report for GitLab Pages
      - build/reports/jacoco/merged/jacocoMergedReport.xml # Merged XML coverage report
      - bin-processor/build/test-results/
      - mobile-sdk/build/test-results/ # Unit test results
    reports:
      junit:
        - bin-processor/build/test-results/**/TEST-*.xml # bin-processor unit test results
        - mobile-sdk/build/test-results/**/TEST-*.xml # mobile-sdk unit test results
      coverage_report:
        coverage_format: jacoco
        path: build/reports/jacoco/merged/jacocoMergedReport.xml
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - when: on_success # Only run when the previous job in the pipeline has succeeded.

# Firebase Test Lab UI tests (OPTIONAL - manual trigger only)
# Runs after deploy on main. Does not block the pipeline.
# Use to validate the deployed build against real/virtual devices.
#
# View results: https://console.firebase.google.com/project/<GCP_PROJECT_ID>/testlab
# (Replace <GCP_PROJECT_ID> with your project, e.g. paydock---multitenant)
#
# Required CI/CD Variables:
#   - GCP_PROJECT_ID: Your Google Cloud/Firebase project ID
#   - GOOGLE_APPLICATION_CREDENTIALS_BASE64: Base64-encoded service account key JSON
.firebase_test_template:
  stage: firebase_test
  extends: .deploy_template
  # Do NOT set GCP_PROJECT_ID here - it overwrites the project CI/CD variable with empty.
  # Inherit GCP_PROJECT_ID directly from Settings → CI/CD → Variables.
  script:
    - '[ -z "$GCP_PROJECT_ID" ] && [ -n "$GOOGLE_CREDENTIALS_FILE_PATH" ] && export GCP_PROJECT_ID=$(grep -o "\"project_id\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" "$GOOGLE_CREDENTIALS_FILE_PATH" | head -1 | sed "s/.*\"\([^\"]*\)\".*/\1/")'
    - export FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-$GCP_PROJECT_ID}"
    - '[ -n "$GCP_PROJECT_ID" ] || (echo "ERROR: GCP_PROJECT_ID is not set. Add it in GitLab CI/CD Variables." && exit 1)'
    - 'if ! command -v gcloud &>/dev/null; then curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=$HOME; export PATH=$PATH:$HOME/google-cloud-sdk/bin; source $HOME/google-cloud-sdk/path.bash.inc; fi'
    - gcloud auth activate-service-account --key-file=$GOOGLE_CREDENTIALS_FILE_PATH
    - gcloud config set project $GCP_PROJECT_ID
    - "bundle exec fastlane ui_test_firebase device:MediumPhone.arm api:34 timeout:20m flavor:${FLAVOR}"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - mobile-sdk/build/outputs/apk/
      - mobile-sdk/build/test-results/firebase-test-lab/
    reports:
      junit:
        - mobile-sdk/build/test-results/firebase-test-lab/**/*.xml

# Run Firebase Test Lab against STAGING deployment
# Tests the same code that was deployed to Firebase App Distribution (staging)
ui_tests_firebase_staging:
  extends: .firebase_test_template
  variables:
    FLAVOR: staging
  environment:
    name: staging
  needs:
    - deploy_staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Run Firebase Test Lab against SANDBOX deployment
# Tests the same code that was deployed to Firebase App Distribution (sandbox)
ui_tests_firebase_sandbox:
  extends: .firebase_test_template
  variables:
    FLAVOR: sandbox
  environment:
    name: sandbox
  needs:
    - deploy_sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

