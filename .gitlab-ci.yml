# GitLab Pages job to publish HTML coverage reports
# This makes the coverage report accessible via GitLab Pages URL
pages:
  stage: deploy
  dependencies:
    - test
  needs:
    - job: test
      artifacts: true
  script:
    - echo "Publishing coverage report to GitLab Pages"
    - mkdir public
    - ls -la build/reports/jacoco/merged/ || echo "No merged jacoco directory"
    - find build -name "*.html" -path "*/jacoco*" || echo "No HTML files found"
    - cp -r build/reports/jacoco/merged/html/* public/ 2>/dev/null || echo "No coverage HTML report found, creating placeholder"
    - test -f public/index.html || echo "<html><body><h1>Coverage Report Not Available</h1></body></html>" > public/index.html
    - ls -la public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# increment_version:
# This job increments the version code for the build and deployment.
increment_version:
  stage: versioning # Specifies that this job runs in the '.pre' stage, which should be defined before other stages.
  extends: .setup_bundler # Inherits configurations (like Bundler setup) from the '.setup_bundler' template.
  rules: # Defines conditions for when this job should be executed.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Checks if the current branch is the default branch (e.g., 'main').
      when: on_success # Specifies that the job runs automatically when a pipeline successfully reaches this stage.
      # This condition ensures the job runs only when changes are merged into the default branch.
  script: # Defines the commands to run when the job is executed.
    - bundle exec fastlane update_version_code # Executes the 'update_version_code' lane in Fastlane.
    # This lane is responsible for:
    #   1. Reading the current version number from GitLab CI variables (VERSION_NAME, VERSION_CODE).
    #   2. Incrementing the version number and version code.
    #   3. Updating the GitLab CI variables with the new versions.
    #   4. Updating the version number in the 'build.gradle.kts' file.

# fetch_bin_file:
# Fetches the BIN validation file from CloudFront using HTTP caching headers.
# Uses Last-Modified (preferred) or ETag to determine if the file has changed.
# Mirrors the caching logic in BinDataCacheManager.kt for consistency.
# Runs on all MRs to ensure branches have the latest bin file before merging.
fetch_bin_file:
  stage: build
  extends: .setup_bundler
  script:
    - bundle exec fastlane fetch_bin_file
  artifacts:
    paths:
      - bin_schema/
    expire_in: 1 day
  rules:
    # Run on any merge request (ensures bin file is up to date on all branches)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    # Run automatically when commits land on default branch (keeps file up to date)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# commit_bin_file:
# Commits the fetched card schemes file to the repository if it has changed.
# Updates BIN_FILE_LAST_MODIFIED and BIN_FILE_ETAG CI variables after successful commit.
# Uses [skip ci] in commit message to prevent infinite pipeline loops.
commit_bin_file:
  stage: build
  extends: .setup_bundler
  dependencies:
    - fetch_bin_file
  needs:
    - job: fetch_bin_file
      artifacts: true
  script:
    - bundle exec fastlane commit_bin_file
  rules:
    # Run on any merge request (commits updated bin file to source branch)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    # Run automatically when commits land on default branch (keeps file up to date)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# .build_template:
# This is a hidden job template for building the Android application.
# It extends the '.setup_bundler' template.
.build_template:
  stage: build # Runs in the 'build' stage.
  extends: .setup_bundler # Extends the '.setup_bundler' template.
  artifacts:
    expire_in: 7 days
    paths:
      - sample/build/outputs/apk/* # Makes the APK files available as artifacts.

# buildStaging:
# This job builds the staging version of the Android application.
build_staging:
  extends: .build_template # Extends the '.build_template' template.
  script:
    - bundle exec fastlane buildDebug flavor:staging # Executes the 'build' lane using staging flavor in the Fastfile.
    # Fastfile Reference: This lane is defined in the Fastfile and handles the actual build process.
  environment:
    name: staging
  rules:
#    - if: $CI_COMMIT_BRANCH  # Run on all branch pushes
#      when: on_success
    - if: $CI_MERGE_REQUEST_IID # Run on merge (Merge Results)
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run on merge to main
      when: on_success

# buildSandbox:
# This job builds the sandbox version of the Android application.
build_sandbox:
  extends: .build_template # Extends the '.build_template' template.
  script:
    - bundle exec fastlane buildDebug flavor:sandbox # Executes the 'build' lane using sandbox flavor in the Fastfile.
    # Fastfile Reference: This lane is defined in the Fastfile and handles the actual build process.
  environment:
    name: sandbox
  needs: [increment_version]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run on merge to main
      when: on_success

