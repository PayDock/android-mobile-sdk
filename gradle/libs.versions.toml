[versions]
afterpayAndroid = "4.7.0"
# KMP: Maximum tested Android Gradle Plugin version: 8.5
agp = "8.13.0"
androidx-test-junit = "1.3.0"
androidx-test-espresso = "3.7.0"
androidx-activity-compose = "1.11.0"
composeWebview = "0.33.6"
# Compose BOM version is resrticeted to "2025.06.01" - Latest: Sep 2025
composeBOM="2025.06.01" # Only update when specified!
core = "1.17.0"
dependencyGuard = "0.5.0"
detekt = "1.23.8"
googlePayServices="16.5.0"
googlePayWalletServices="19.4.0"
googlePayComposeButton="1.1.0"
hilt = "2.57.1"
hiltNavigationCompose = "1.3.0"
jacoco = "0.8.11" # Used in our test-coverage-convention.gradle.kts
json = "20250517"
junit = "4.13.2"
kotlin = "2.2.20"
koin = "4.1.0"  # Compatible with Compose 1.8.3 BOM
kotlinxCoroutines = "1.10.2"
kotlinxCoroutinesPlayServices = "1.10.2"
kotlinxHtmlJvm = "0.12.0"
kotlinxSerializationJson = "1.9.0"
kspDevTools = "2.2.20-2.0.3" # https://github.com/google/ksp/releases
lifecycle = "2.8.7"  # Compatible with Compose 1.8.3 BOM (2.9.4+ pulls Compose 1.9.0)
# Instrumentation tests fail on (1.13.4 and 1.13.5 - https://github.com/mockk/mockk/issues/1035)
# Unit tests fail on (1.13.16) issue with Result<T>
mockk = "1.14.5"
mockito = "6.0.0"
mockitoAndroid = "5.20.0"
okhttp = "5.1.0"
paydockCoreNetworking = "1.4.0"
paypalWebPayments = "2.3.0"
retrofit = "3.0.0"
runner = "1.7.0"
turbine = "1.2.1"
slf4jJdk14 = "2.0.17"
jreleaser = "1.20.0"
# Dependency Validation
dependencyAnalysis = "3.3.0"  # Latest stable - Kotlin 2.2 support

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp-devtools = { id = "com.google.devtools.ksp", version.ref = "kspDevTools" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Dependency Validation Plugins
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
dependency-guard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }

[libraries]
# Android
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-lifecycle-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
# AndroidX - Testing
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-ext = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBOM" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-foundation-android = { module = "androidx.compose.foundation:foundation" }
#Compose - Debug (Previews)
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview-android = { module = "androidx.compose.ui:ui-tooling-preview" }
#Compose - UI Test
androidx-ui-test-junit4-android = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# UI Libs
compose-webview = { module = "io.github.kevinnzou:compose-webview", version.ref = "composeWebview" }
# Kotlin
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-html-jvm = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinxHtmlJvm" }
# Kotlin Testing
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
# Kotlin Coroutines
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutinesPlayServices" }
# Kotlin Coroutines Testing
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Other (Utils, Tools)
json = { module = "org.json:json", version.ref = "json" }
# Retrofit - SampleApp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp3-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# Koin (Kotlin Injection) - SDK
koin = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
# Koin Testing - SDK
koin-test = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
# Hilt (Android  Injection) - SampleApp
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# Detekt (Linting)
detekt-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
detekt-formatting-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
# Dependency Analysis (Validation)
dependency-analysis-plugin = { group = "com.autonomousapps", name = "dependency-analysis-gradle-plugin", version.ref = "dependencyAnalysis" }
# Google Services (Google Pay)
google-pay-services = { group = "com.google.android.gms", name = "play-services-pay", version.ref = "googlePayServices" }
google-wallet-services = { group = "com.google.android.gms", name = "play-services-wallet", version.ref = "googlePayWalletServices" }
google-compose-pay-button = { group = "com.google.pay.button", name = "compose-pay-button", version.ref = "googlePayComposeButton" }
# Paydock SDK (Internal)
paydock-core-networking = { module = "com.paydock.core:network", version.ref = "paydockCoreNetworking" }
# Afterpay SDK
afterpay-android = { module = "com.afterpay:afterpay-android", version.ref = "afterpayAndroid" }
# PayPal SDK
paypal-payment-buttons = { module = "com.paypal.android:payment-buttons", version.ref = "paypalWebPayments" }
paypal-web-payments = { module = "com.paypal.android:paypal-web-payments", version.ref = "paypalWebPayments" }
paypal-fraud-protection = { module = "com.paypal.android:fraud-protection", version.ref = "paypalWebPayments" }
# JReleaser
org-jreleaser-gradle-plugin = { module = "org.jreleaser:org.jreleaser.gradle.plugin", version.ref = "jreleaser" }

#General Testing (Mocking, State Management)
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
mockito = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito" }
mockito-android = { module = "org.mockito:mockito-android", version.ref = "mockitoAndroid" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4jJdk14" }

[bundles]
# Bundles are are being used by SDK
androidx = ["androidx-core-ktx"]
compose = ["compose-material3", "androidx-activity-compose", "androidx-foundation-android", "compose-webview"]
composeDebug = ["androidx-ui-tooling", "androidx-ui-tooling-preview-android"]
coroutins = ["kotlinx-coroutines", "kotlinx-coroutines-play-services"]
koin = ["koin", "koin-android", "koin-compose"]
kotlin = ["kotlinx-html-jvm", "kotlinx-serialization-json"]
hilt = ["hilt-android", "hilt-navigation-compose"]
paypal = ["paypal-web-payments", "paypal-fraud-protection"]
retrofit = ["retrofit", "retrofit-converter-gson", "okhttp", "okhttp3-logging"]
google-pay-services = ["google-pay-services", "google-wallet-services"]